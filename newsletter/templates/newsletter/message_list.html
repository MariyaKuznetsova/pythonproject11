{% extends 'newsletter/base.html' %}
{% block content %}
<section class="py-1 text-center container">
            <div class="row py-lg-2">
                <div class="col-lg-2 col-md-2 mx-auto">
                    <a class="btn btn-success" href="{% url 'newsletter:message_create' %}" role="article">Добавить сообщение</a>
                </div>
            </div>
        </section>
<div class="album py-9 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
            {% for message in object_list %}
            {% if message.owner == request.user %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">Тема письма: {{ message.subject }}</p>
                        <p class="card-text">Тело письма: {{ message.text }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="col-8">
                                {% csrf_token %}
                                <a class="btn btn-primary" href="{% url 'newsletter:message_detail' message.pk %}" role="article">Посмотреть</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endif %}
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
