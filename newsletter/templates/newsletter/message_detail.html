{% extends 'newsletter/base.html' %}
{% block content %}
<div class="album py-9 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">Тема письма: {{ object.subject }}</p>
                        <p class="card-text">Тело письма: {{ object.text|truncatechars:20 }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="col-8">
                                {% if object.owner == request.user %}
                                <a class="btn btn-danger" href="{% url 'newsletter:message_delete' message.pk %}" role="article">Удалить</a>
                                <a class="btn btn-primary" href="{% url 'newsletter:message_update' message.pk %}" role="article">Редактировать</a>
                                {% endif %}
                                </div>
                                <div class="col-5">
                                <a class="btn btn-primary" href="{% url 'newsletter:message_list' %}" role="article">Назад</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
