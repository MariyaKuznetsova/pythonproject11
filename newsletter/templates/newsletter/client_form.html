{% extends 'newsletter/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-6">
        <form class="row" method="post" enctype="multipart/form-data">
            <div class="card">
                <div class="card-body">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <div class="col-4">
            <button type="submit" class="btn btn-primary">
                {% if object %}
                Сохранить
                {% else %}
                Создать
                {% endif %}
            </button>
            <a href="{% url 'newsletter:client_list' %}" class="btn btn-danger">Отмена</a>
             </div>
                    </div>
                </div>
        </form>
        </div>
    </div>
</div>
{% endblock %}
